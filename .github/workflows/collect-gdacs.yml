name: Collect GDACS events

on:
  push:
    paths:
      - 'backend/collect-gdacs.mjs'
      - 'backend/parse-gdacs-feed.py'
      - 'js/gdacs-status.js'
      - '.github/workflows/collect-gdacs.yml'
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect GDACS snapshot
        run: node backend/collect-gdacs.mjs
      - name: Publish snapshot
        run: |
          git add public-data/gdacs-events.json public-data/gdacs-disaster-history.json
          if [ -f public-data/gdacs-history.json ]; then git add public-data/gdacs-history.json; fi
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish GDACS snapshot [skip ci]"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir -p "$RUNNER_TEMP/ndw-public"
          cp index.html CNAME favicon.svg sw.js manifest.webmanifest robots.txt sitemap.xml "$RUNNER_TEMP/ndw-public/"
          cp -R js css assets public-data "$RUNNER_TEMP/ndw-public/"
          ALLOW_STALE_DATA=1 node backend/prepare-site.mjs "$RUNNER_TEMP/ndw-public"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/ndw-public
      - uses: actions/deploy-pages@v4
