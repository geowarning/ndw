name: Collect GDACS events

on:
  push:
    paths:
      - 'backend/collect-gdacs.mjs'
      - '.github/workflows/collect-gdacs.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdacs-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect GDACS snapshot
        run: node backend/collect-gdacs.mjs
      - name: Publish snapshot
        run: |
          git add public-data/gdacs-events.json public-data/gdacs-disaster-history.json
          if [ -f public-data/gdacs-history.json ]; then git add public-data/gdacs-history.json; fi
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish GDACS snapshot [skip ci]"
          git pull --rebase origin main
          git push
