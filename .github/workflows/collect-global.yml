name: Collect global earthquakes

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect earthquake snapshot
        env:
          APIZERO_KEY: ${{ secrets.APIZERO_KEY }}
        run: node backend/collect-global.mjs
      - name: Publish snapshot
        run: |
          if git diff --quiet -- public-data/global-earthquakes.json public-data/global-quakes-history.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public-data/global-earthquakes.json public-data/global-quakes-history.json
          git commit -m "Publish global earthquake snapshot [skip ci]"
          git pull --rebase origin main
          git push
