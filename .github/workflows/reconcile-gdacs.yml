name: Reconcile GDACS history

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gdacs-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reconcile GDACS history
        run: node backend/collect-gdacs.mjs --reconcile
      - name: Publish reconciliation
        run: |
          git add public-data/gdacs-events.json public-data/gdacs-disaster-history.json
          if [ -f public-data/gdacs-history.json ]; then git add public-data/gdacs-history.json; fi
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Reconcile GDACS history [skip ci]"
          git pull --rebase origin main
          git push
